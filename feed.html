<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTONE Ride Club</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --accent: #9B30C8;
    --accent-tint: rgba(155, 48, 200, 0.12);
    --bg: #ffffff;
    --surface: #f7f5f8;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-muted: #9a9a9a;
    --border: #e8e4ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .screen { padding: 16px; max-width: 480px; margin: 0 auto; }
  .hidden { display: none !important; }
  .week-label { font-size: 24px; font-weight: 700; color: var(--text); margin: 4px 0 20px; text-align: center; }
  .event-card { padding: 24px 0; border-bottom: 8px solid var(--surface); }
  .event-card:first-child { padding-top: 0; }
  .event-card:last-child { border-bottom: none; }
  .detail-title { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .detail-meta {
    font-size: 14px; color: var(--text-secondary); margin: 4px 0;
    display: flex; align-items: center; gap: 6px;
  }
  .detail-desc { font-size: 15px; color: var(--text-secondary); line-height: 1.6; margin: 16px 0; }
  .rsvp-btn {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .rsvp-btn.joined { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .post-link {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px;
    border: 1px solid var(--border); color: var(--text); text-decoration: none;
    font-size: 14px; font-weight: 500; background: none; cursor: pointer;
  }
  .participants-block { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
  .participants-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .participants-header span:first-child { font-size: 14px; font-weight: 600; }
  .participant-row {
    display: flex; align-items: center; gap: 10px; padding: 6px 0;
    text-decoration: none; color: inherit;
  }
  .participant-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent-tint); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .participant-name { font-size: 14px; margin: 0; }
  .participant-handle { font-size: 12px; color: var(--text-muted); margin: 0; }
  .empty-state { font-size: 14px; color: var(--text-muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>

<div id="gate-screen" class="screen hidden">
  <div style="text-align:center; padding-top:56px;">
    <p style="font-size:15px; color:var(--text); line-height:1.7; margin:0 0 24px; padding:0 8px;">В целях безопасности и комфорта всех участников – записаться на покатушки могут только люди с аватаркой и реальным именем. Пожалуйста, заполни свой профиль и записывайся ❤️</p>
    <button class="rsvp-btn" onclick="location.reload()">Я добавил(а) фото — проверить</button>
  </div>
</div>

<div id="feed-screen" class="screen">
  <p class="week-label">Запланированные покатушки</p>
  <div id="event-feed"></div>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

var isRealTelegramLaunch = !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.user);

var currentUser = isRealTelegramLaunch ? tg.initDataUnsafe.user : {
  id: 'test_user', first_name: 'Гость', username: ''
};

var hasPhoto = isRealTelegramLaunch ? !!(currentUser && currentUser.photo_url) : true;

var state = { events: [], rsvps: {} };

function loadData() {
  fetch('/api/list')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      state.events = data.events || [];
      state.rsvps = data.rsvps || {};
      renderFeed();
    })
    .catch(function () {
      document.getElementById('event-feed').innerHTML =
        '<p class="empty-state">Не получилось загрузить заезды. Попробуй позже.</p>';
    });
}

function renderFeed() {
  var container = document.getElementById('event-feed');
  container.innerHTML = '';
  if (state.events.length === 0) {
    container.innerHTML = '<p class="empty-state">Пока нет активных заездов</p>';
    return;
  }
  state.events.forEach(function (ev) {
    var card = document.createElement('div');
    card.className = 'event-card';
    card.innerHTML =
      '<p class="detail-title">' + escapeHtml(ev.title) + '</p>' +
      '<div class="detail-meta">📅 ' + escapeHtml(ev.date) + ', ' + escapeHtml(ev.time) + '</div>' +
      '<div class="detail-meta">📍 ' + escapeHtml(ev.place) + '</div>' +
      '<p class="detail-desc">' + escapeHtml(ev.desc) + '</p>' +
      '<button class="rsvp-btn" id="rsvp-btn-' + ev.id + '" onclick="toggleRsvp(\'' + ev.id + '\')">Я буду</button>' +
      '<button class="post-link hidden" id="post-link-' + ev.id + '" onclick="openPostLink(\'' + ev.id + '\')">📎 Подробнее в канале</button>' +
      '<div class="participants-block">' +
        '<div class="participants-header">' +
          '<span>Кто едет</span>' +
          '<span id="rsvp-count-' + ev.id + '">0</span>' +
        '</div>' +
        '<div id="participant-list-' + ev.id + '"></div>' +
      '</div>';
    container.appendChild(card);

    var postBtn = document.getElementById('post-link-' + ev.id);
    if (ev.postUrl) { postBtn.classList.remove('hidden'); } else { postBtn.classList.add('hidden'); }

    renderParticipants(ev.id);
  });
}

function renderParticipants(eventId) {
  var list = state.rsvps[eventId] || [];
  var container = document.getElementById('participant-list-' + eventId);
  container.innerHTML = '';
  document.getElementById('rsvp-count-' + eventId).textContent = list.length;

  var isJoined = list.some(function (p) { return String(p.telegram_id) === String(currentUser.id); });
  updateButton(eventId, isJoined);

  if (list.length === 0) {
    container.innerHTML = '<p class="empty-state" style="padding:16px 0;">Пока никто не отметился</p>';
    return;
  }

  list.forEach(function (p) {
    var name = (p.first_name || '') + (p.last_name ? ' ' + p.last_name : '');
    var initials = (p.first_name || '?').charAt(0).toUpperCase();
    var el;
    if (p.username) {
      el = document.createElement('a');
      el.href = 'https://t.me/' + p.username;
      el.target = '_blank';
    } else {
      el = document.createElement('div');
    }
    el.className = 'participant-row';
    el.innerHTML =
      '<div class="participant-avatar">' + initials + '</div>' +
      '<div>' +
        '<p class="participant-name">' + escapeHtml(name || 'Без имени') + '</p>' +
        '<p class="participant-handle">' + (p.username ? '@' + escapeHtml(p.username) : 'профиль скрыт') + '</p>' +
      '</div>';
    container.appendChild(el);
  });
}

function updateButton(eventId, isJoined) {
  var btn = document.getElementById('rsvp-btn-' + eventId);
  if (!btn) return;
  btn.textContent = isJoined ? 'Отменить запись' : 'Я буду';
  btn.classList.toggle('joined', isJoined);
}

function toggleRsvp(eventId) {
  var btn = document.getElementById('rsvp-btn-' + eventId);
  var isJoined = btn.classList.contains('joined');
  var action = isJoined ? 'cancel' : 'join';
  btn.disabled = true;

  fetch('/api/rsvp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: action,
      event_id: eventId,
      user: {
        id: currentUser.id,
        username: currentUser.username || '',
        first_name: currentUser.first_name || '',
        last_name: currentUser.last_name || ''
      }
    })
  })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      state.rsvps = data.rsvps || {};
      renderParticipants(eventId);
      btn.disabled = false;
    })
    .catch(function () { btn.disabled = false; });
}

function openPostLink(eventId) {
  var ev = state.events.filter(function (e) { return String(e.id) === String(eventId); })[0];
  var url = ev && ev.postUrl;
  if (!url) return;
  if (tg && /^https:\/\/t\.me\//.test(url) && tg.openTelegramLink) {
    tg.openTelegramLink(url);
  } else if (tg && tg.openLink) {
    tg.openLink(url);
  } else {
    window.open(url, '_blank');
  }
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

if (hasPhoto) {
  loadData();
} else {
  document.getElementById('feed-screen').classList.add('hidden');
  document.getElementById('gate-screen').classList.remove('hidden');
}
</script>
</body>
</html>
