<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTONE Ride Club</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #9B30C8;
    --accent-tint: rgba(155, 48, 200, 0.12);
    --bg: #ffffff;
    --surface: #f7f5f8;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-muted: #9a9a9a;
    --border: #e8e4ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .screen { padding: 16px; max-width: 480px; margin: 0 auto; }
  .hidden { display: none !important; }
  .week-label { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 24px; color: var(--text); margin: 4px 0 16px; text-align: center; }
  .event-row {
    padding: 18px 6px; border-bottom: 1px solid var(--border);
  }
  .event-row:last-child { border-bottom: none; }
  .event-row-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .event-icon {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--accent-tint);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 20px;
  }
  .event-info { flex: 1; }
  .event-title { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 17px; margin: 0; }
  .event-meta { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; color: var(--accent); margin: 4px 0 0; }
  .details-btn {
    width: 100%; padding: 11px; border-radius: 10px;
    border: 1px solid var(--border); background: none; color: var(--text);
    font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; color: var(--text-secondary);
    font-size: 14px; padding: 0 0 16px; cursor: pointer;
  }
  .detail-title { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 20px; margin: 0 0 8px; }
  .detail-meta {
    font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; color: var(--accent); margin: 4px 0;
    display: flex; align-items: center; gap: 6px; line-height: 1.6;
  }
  .detail-desc { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 500; color: var(--text-secondary); line-height: 1.6; margin: 16px 0; }
  .rsvp-btn {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .rsvp-btn.joined { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .post-link {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 10px; padding: 12px; border-radius: 12px;
    border: 1px solid var(--border); color: var(--text); text-decoration: none;
    font-size: 14px; font-weight: 500; background: none; cursor: pointer;
  }
  .participants-block { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
  .participants-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .participants-header span:first-child { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 700; }
  .participant-row {
    display: flex; align-items: center; gap: 10px; padding: 6px 0;
    text-decoration: none; color: inherit;
  }
  .participant-avatar {
    width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
    background: var(--accent-tint); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .participant-name { font-size: 14px; margin: 0; }
  .participant-handle { font-size: 12px; color: var(--text-muted); margin: 0; }
  .empty-state { font-size: 14px; color: var(--text-muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>

<div id="home-screen" class="screen">
  <p class="week-label">Запланированные покатушки</p>
  <div id="event-list"></div>
</div>

<div id="detail-screen" class="screen hidden">
  <button class="back-btn" onclick="showHome()">&larr; Назад</button>
  <p class="detail-title" id="d-title"></p>
  <div class="detail-meta">📅 <span id="d-date"></span></div>
  <div class="detail-meta">📍 <span id="d-place"></span></div>
  <div class="detail-meta hidden" id="d-difficulty-row">💪 Сложность: <span id="d-difficulty"></span></div>
  <p class="detail-desc" id="d-desc"></p>
  <button class="rsvp-btn" id="rsvp-btn" onclick="toggleRsvp()">Я еду с вами!</button>
  <button class="post-link hidden" id="post-link" onclick="openPostLink()">📎 Подробнее в канале</button>
  <div class="participants-block">
    <div class="participants-header">
      <span>Кто едет</span>
      <span id="rsvp-count">0</span>
    </div>
    <div id="participant-list"></div>
  </div>
</div>

<script>
// index.html и /api/* теперь живут на одном домене (один проект на Vercel),
// поэтому отдельный адрес API не нужен — используются относительные пути.

var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// Если открыть файл просто в браузере (не через Telegram), подставится тестовый пользователь
var currentUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {
  id: 'test_user', first_name: 'Гость', username: ''
};

// Значение из ссылки вида .../rideclub?startapp=... — открывает конкретный заезд напрямую
var startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
var didAutoOpen = false;

var state = { events: [], rsvps: {}, currentEventId: null, currentPostUrl: '' };

function loadData() {
  fetch('/api/list')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      state.events = data.events || [];
      state.rsvps = data.rsvps || {};
      renderEventList();
      if (startParam && !didAutoOpen) {
        didAutoOpen = true;
        var target = state.events.filter(function (e) { return String(e.id) === String(startParam); })[0];
        if (target) showDetail(target.id);
      }
    })
    .catch(function () {
      document.getElementById('event-list').innerHTML =
        '<p class="empty-state">Не получилось загрузить заезды. Попробуй позже.</p>';
    });
}

function renderEventList() {
  var container = document.getElementById('event-list');
  container.innerHTML = '';
  if (state.events.length === 0) {
    container.innerHTML = '<p class="empty-state">Пока нет активных заездов</p>';
    return;
  }
  state.events.forEach(function (ev) {
    var row = document.createElement('div');
    row.className = 'event-row';
    var difficultyLine = ev.difficulty
      ? '<p class="event-meta">😎 Сложность: ' + escapeHtml(ev.difficulty) + '</p>'
      : '';
    row.innerHTML =
      '<div class="event-row-top">' +
        '<div class="event-icon">' + escapeHtml(ev.icon) + '</div>' +
        '<div class="event-info">' +
          '<p class="event-title">' + escapeHtml(ev.title) + '</p>' +
          '<p class="event-meta">📅 ' + escapeHtml(ev.date) + ', ' + escapeHtml(ev.time) + '</p>' +
          '<p class="event-meta">📍 ' + escapeHtml(ev.place) + '</p>' +
          difficultyLine +
        '</div>' +
      '</div>' +
      '<button class="details-btn">Подробнее</button>';
    row.querySelector('.details-btn').onclick = function () { showDetail(ev.id); };
    container.appendChild(row);
  });
}

function showDetail(eventId) {
  state.currentEventId = eventId;
  var ev = state.events.filter(function (e) { return String(e.id) === String(eventId); })[0];
  if (!ev) return;
  document.getElementById('d-title').textContent = ev.title;
  document.getElementById('d-date').textContent = ev.date + ', ' + ev.time;
  document.getElementById('d-place').textContent = ev.place;
  var diffRow = document.getElementById('d-difficulty-row');
  if (ev.difficulty) {
    document.getElementById('d-difficulty').textContent = ev.difficulty;
    diffRow.classList.remove('hidden');
  } else {
    diffRow.classList.add('hidden');
  }
  document.getElementById('d-desc').textContent = ev.desc;
  state.currentPostUrl = ev.postUrl || '';
  var postBtn = document.getElementById('post-link');
  postBtn.classList.toggle('hidden', !state.currentPostUrl);
  renderParticipants(eventId);
  document.getElementById('home-screen').classList.add('hidden');
  document.getElementById('detail-screen').classList.remove('hidden');
}

function showHome() {
  document.getElementById('detail-screen').classList.add('hidden');
  document.getElementById('home-screen').classList.remove('hidden');
  loadData();
}

function openPostLink() {
  var url = state.currentPostUrl;
  if (!url) return;
  if (tg && /^https:\/\/t\.me\//.test(url) && tg.openTelegramLink) {
    tg.openTelegramLink(url);
  } else if (tg && tg.openLink) {
    tg.openLink(url);
  } else {
    window.open(url, '_blank');
  }
}

function renderParticipants(eventId) {
  var list = state.rsvps[eventId] || [];
  var container = document.getElementById('participant-list');
  container.innerHTML = '';
  document.getElementById('rsvp-count').textContent = list.length;

  var isJoined = list.some(function (p) { return String(p.telegram_id) === String(currentUser.id); });
  updateButton(isJoined);

  if (list.length === 0) {
    container.innerHTML = '<p class="empty-state" style="padding:16px 0;">Пока никто не отметился</p>';
    return;
  }

  list.forEach(function (p) {
    var name = (p.first_name || '') + (p.last_name ? ' ' + p.last_name : '');
    var initials = (p.first_name || '?').charAt(0).toUpperCase();
    var el;
    if (p.username) {
      el = document.createElement('a');
      el.href = 'https://t.me/' + p.username;
      el.target = '_blank';
    } else {
      el = document.createElement('div');
    }
    el.className = 'participant-row';
    var avatarInner = p.photo_url
      ? '<img src="' + escapeHtml(p.photo_url) + '" data-initials="' + escapeHtml(initials) + '" onerror="handleAvatarError(this)" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'
      : initials;
    el.innerHTML =
      '<div class="participant-avatar">' + avatarInner + '</div>' +
      '<div>' +
        '<p class="participant-name">' + escapeHtml(name || 'Без имени') + '</p>' +
        '<p class="participant-handle">' + (p.username ? '@' + escapeHtml(p.username) : 'профиль скрыт') + '</p>' +
      '</div>';
    container.appendChild(el);
  });
}

function handleAvatarError(img) {
  var initials = img.getAttribute('data-initials') || '?';
  img.parentElement.textContent = initials;
}

function updateButton(isJoined) {
  var btn = document.getElementById('rsvp-btn');
  btn.textContent = isJoined ? 'Отменить запись' : 'Я еду с вами!';
  btn.classList.toggle('joined', isJoined);
}

function toggleRsvp() {
  var btn = document.getElementById('rsvp-btn');
  var isJoined = btn.classList.contains('joined');
  var action = isJoined ? 'cancel' : 'join';
  btn.disabled = true;

  fetch('/api/rsvp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: action,
      event_id: state.currentEventId,
      user: {
        id: currentUser.id,
        username: currentUser.username || '',
        first_name: currentUser.first_name || '',
        last_name: currentUser.last_name || '',
        photo_url: currentUser.photo_url || ''
      }
    })
  })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      state.rsvps = data.rsvps || {};
      renderParticipants(state.currentEventId);
      btn.disabled = false;
    })
    .catch(function () { btn.disabled = false; });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

loadData();
</script>
</body>
</html>
