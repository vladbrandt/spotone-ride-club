<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTONE Ride Club</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --accent: #9B30C8;
    --accent-tint: rgba(155, 48, 200, 0.12);
    --bg: #ffffff;
    --surface: #f7f5f8;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-muted: #9a9a9a;
    --border: #e8e4ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .screen { padding: 16px; max-width: 480px; margin: 0 auto; }
  .hidden { display: none !important; }
  .week-label { font-size: 13px; color: var(--text-secondary); margin: 0 0 12px; }
  .event-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 4px; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .event-row:last-child { border-bottom: none; }
  .event-icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent-tint);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 18px;
  }
  .event-info { flex: 1; }
  .event-title { font-size: 15px; font-weight: 600; margin: 0; }
  .event-meta { font-size: 13px; color: var(--text-secondary); margin: 2px 0 0; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; color: var(--text-secondary);
    font-size: 14px; padding: 0 0 16px; cursor: pointer;
  }
  .detail-title { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .detail-meta {
    font-size: 14px; color: var(--text-secondary); margin: 4px 0;
    display: flex; align-items: center; gap: 6px;
  }
  .detail-desc { font-size: 15px; color: var(--text-secondary); line-height: 1.6; margin: 16px 0; }
  .rsvp-btn {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .rsvp-btn.joined { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .participants-block { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
  .participants-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .participants-header span:first-child { font-size: 14px; font-weight: 600; }
  .participant-row {
    display: flex; align-items: center; gap: 10px; padding: 6px 0;
    text-decoration: none; color: inherit;
  }
  .participant-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent-tint); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .participant-name { font-size: 14px; margin: 0; }
  .participant-handle { font-size: 12px; color: var(--text-muted); margin: 0; }
  .empty-state { font-size: 14px; color: var(--text-muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>

<div id="gate-screen" class="screen hidden">
  <div style="text-align:center; padding-top:56px;">
    <p style="font-size:15px; color:var(--text); line-height:1.7; margin:0 0 24px; padding:0 8px;">В целях безопасности и комфорта всех участников – записаться на покатушки могут только люди с аватаркой и реальным именем. Пожалуйста, заполни свой профиль и записывайся ❤️</p>
    <button class="rsvp-btn" onclick="location.reload()">Я добавил(а) фото — проверить</button>
  </div>
</div>

<div id="home-screen" class="screen">
  <p class="week-label">Заезды на этой неделе</p>
  <div id="event-list"></div>
</div>

<div id="detail-screen" class="screen hidden">
  <button class="back-btn" onclick="showHome()">&larr; Назад</button>
  <p class="detail-title" id="d-title"></p>
  <div class="detail-meta">📅 <span id="d-date"></span></div>
  <div class="detail-meta">📍 <span id="d-place"></span></div>
  <p class="detail-desc" id="d-desc"></p>
  <button class="rsvp-btn" id="rsvp-btn" onclick="toggleRsvp()">Я буду</button>
  <div class="participants-block">
    <div class="participants-header">
      <span>Кто едет</span>
      <span id="rsvp-count">0</span>
    </div>
    <div id="participant-list"></div>
  </div>
</div>

<script>
// index.html и /api/* теперь живут на одном домене (один проект на Vercel),
// поэтому отдельный адрес API не нужен — используются относительные пути.

var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// tg.initDataUnsafe.user появляется, только если апп реально запущен из Telegram —
// сам объект Telegram.WebApp скрипт создаёт даже в обычном браузере, поэтому ориентируемся
// именно на наличие данных пользователя, а не на факт существования tg.
var isRealTelegramLaunch = !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.user);

// Если открыть файл просто в браузере (не через Telegram), подставится тестовый пользователь
var currentUser = isRealTelegramLaunch ? tg.initDataUnsafe.user : {
  id: 'test_user', first_name: 'Гость', username: ''
};

// Проверку делаем только внутри настоящего Telegram — вне его (локальный просмотр) не блокируем.
var hasPhoto = isRealTelegramLaunch ? !!(currentUser && currentUser.photo_url) : true;

// Значение из ссылки вида .../rideclub?startapp=... — открывает конкретный заезд напрямую
var startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
var didAutoOpen = false;

var state = { events: [], rsvps: {}, currentEventId: null };

function loadData() {
  fetch('/api/list')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      state.events = data.events || [];
      state.rsvps = data.rsvps || {};
      renderEventList();
      if (startParam && !didAutoOpen) {
        didAutoOpen = true;
        var target = state.events.filter(function (e) { return String(e.id) === String(startParam); })[0];
        if (target) showDetail(target.id);
      }
    })
    .catch(function () {
      document.getElementById('event-list').innerHTML =
        '<p class="empty-state">Не получилось загрузить заезды. Попробуй позже.</p>';
    });
}

function renderEventList() {
  var container = document.getElementById('event-list');
  container.innerHTML = '';
  if (state.events.length === 0) {
    container.innerHTML = '<p class="empty-state">Пока нет активных заездов</p>';
    return;
  }
  state.events.forEach(function (ev) {
    var row = document.createElement('div');
    row.className = 'event-row';
    row.onclick = function () { showDetail(ev.id); };
    row.innerHTML =
      '<div class="event-icon">🚲</div>' +
      '<div class="event-info">' +
        '<p class="event-title">' + escapeHtml(ev.title) + '</p>' +
        '<p class="event-meta">' + escapeHtml(ev.date) + ', ' + escapeHtml(ev.time) + ' · ' + escapeHtml(ev.place) + '</p>' +
      '</div>';
    container.appendChild(row);
  });
}

function showDetail(eventId) {
  state.currentEventId = eventId;
  var ev = state.events.filter(function (e) { return String(e.id) === String(eventId); })[0];
  if (!ev) return;
  document.getElementById('d-title').textContent = ev.title;
  document.getElementById('d-date').textContent = ev.date + ', ' + ev.time;
  document.getElementById('d-place').textContent = ev.place;
  document.getElementById('d-desc').textContent = ev.desc;
  renderParticipants(eventId);
  document.getElementById('home-screen').classList.add('hidden');
  document.getElementById('detail-screen').classList.remove('hidden');
}

function showHome() {
  document.getElementById('detail-screen').classList.add('hidden');
  document.getElementById('home-screen').classList.remove('hidden');
  loadData();
}

function renderParticipants(eventId) {
  var list = state.rsvps[eventId] || [];
  var container = document.getElementById('participant-list');
  container.innerHTML = '';
  document.getElementById('rsvp-count').textContent = list.length;

  var isJoined = list.some(function (p) { return String(p.telegram_id) === String(currentUser.id); });
  updateButton(isJoined);

  if (list.length === 0) {
    container.innerHTML = '<p class="empty-state" style="padding:16px 0;">Пока никто не отметился</p>';
    return;
  }

  list.forEach(function (p) {
    var name = (p.first_name || '') + (p.last_name ? ' ' + p.last_name : '');
    var initials = (p.first_name || '?').charAt(0).toUpperCase();
    var el;
    if (p.username) {
      el = document.createElement('a');
      el.href = 'https://t.me/' + p.username;
      el.target = '_blank';
    } else {
      el = document.createElement('div');
    }
    el.className = 'participant-row';
    el.innerHTML =
      '<div class="participant-avatar">' + initials + '</div>' +
      '<div>' +
        '<p class="participant-name">' + escapeHtml(name || 'Без имени') + '</p>' +
        '<p class="participant-handle">' + (p.username ? '@' + escapeHtml(p.username) : 'профиль скрыт') + '</p>' +
      '</div>';
    container.appendChild(el);
  });
}

function updateButton(isJoined) {
  var btn = document.getElementById('rsvp-btn');
  btn.textContent = isJoined ? 'Отменить запись' : 'Я буду';
  btn.classList.toggle('joined', isJoined);
}

function toggleRsvp() {
  var btn = document.getElementById('rsvp-btn');
  var isJoined = btn.classList.contains('joined');
  var action = isJoined ? 'cancel' : 'join';
  btn.disabled = true;

  fetch('/api/rsvp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: action,
      event_id: state.currentEventId,
      user: {
        id: currentUser.id,
        username: currentUser.username || '',
        first_name: currentUser.first_name || '',
        last_name: currentUser.last_name || ''
      }
    })
  })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      state.rsvps = data.rsvps || {};
      renderParticipants(state.currentEventId);
      btn.disabled = false;
    })
    .catch(function () { btn.disabled = false; });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

if (hasPhoto) {
  loadData();
} else {
  document.getElementById('home-screen').classList.add('hidden');
  document.getElementById('gate-screen').classList.remove('hidden');
}
</script>
</body>
</html>
